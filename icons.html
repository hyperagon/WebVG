html, body { height: 100%; font-family: sans-serif; background: var(--bg-dark); color: var(--text-muted); font-size: 12px; display: grid; }
div#container {
  display: grid;

}

div#container div { text-align: center; }

<script>
const icons=["i-file","i-edit","i-eye", "i-eye-off","i-layers","i-help","i-new","i-folder","i-save","i-saveas","i-upload","i-code" ,"i-image","i-font","i-download","i-crop","i-anim","i-undo","i-redo","i-cut","i-copy","i-paste","i-trash","i-selectall","i-settings","i-zoomin","i-zoomout","i-fit","i-ruler","i-grid","i-snap","i-snapobj","i-snapanc","i-guides","i-front","i-back","i-arrowup","i-arrowdown","i-lock","i-lockopen","i-union","i-subtract","i-intersect","i-exclude","i-group","i-ungroup","i-info","i-keyboard","i-book","i-cursor","i-rect","i-circle","i-polyton","i-line","i-wave","i-pen","i-text","i-tune","i-geometry","i-droplet","i-list" ,"i-chevron","i-plus","i-folderplus","i-move","i-rotate","i-play","i-stop"];
const cont = document.getElementById("container");

for (let i = 0; i < icons.length; ++i) {
  const id = icons[i];

  const item = document.createElement("div");

  const itemSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const itemUse = document.createElementNS("http://www.w3.org/2000/svg", "use");

  // set the reference
  itemUse.setAttribute("href", `#${id}`);
  // (optional legacy)
  itemUse.setAttribute("xlink:href", `#${id}`);

  const itemName = document.createElement("div");
  itemName.textContent = id;

  itemSvg.appendChild(itemUse);
  item.appendChild(itemSvg);
  item.appendChild(itemName);
  cont.appendChild(item);
}

</script>
